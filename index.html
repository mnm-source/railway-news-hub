<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway News Hub — Thailand & World</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'IBM Plex Sans Thai', sans-serif; background-color: #F2F4F7; }
        .bg-orange-primary { background-color: #FF7A00; }
        .bg-navy-dark { background-color: #172B43; }
        .border-orange-primary { border-color: #FF7A00; }
        .text-orange-primary { color: #FF7A00; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-navy-dark text-white border-b-4 border-orange-primary shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="bg-orange-primary text-white font-bold p-2 rounded-md text-xl">🚆</span>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">RAILWAY NEWS HUB</h1>
                    <p class="text-xs text-slate-300">ศูนย์รวมข่าวสารรถไฟฟ้าและระบบขนส่งทางราง ประเทศไทยและทั่วโลก</p>
                </div>
            </div>
            <div class="mt-2 sm:mt-0 flex items-center space-x-2 text-xs bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                <span>Live Feed Automation Active</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- Control Bar & Filters -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <div class="flex space-x-2 w-full md:w-auto">
                <button onclick="filterNews('all')" id="btn-all" class="px-4 py-2 rounded-lg text-sm font-semibold bg-navy-dark text-white shadow-sm">ทั้งหมด</button>
                <button onclick="filterNews('Thailand')" id="btn-th" class="px-4 py-2 rounded-lg text-sm font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200">🇹🇭 ข่าวไทย</button>
                <button onclick="filterNews('International')" id="btn-int" class="px-4 py-2 rounded-lg text-sm font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200">🌏 ข่าวต่างประเทศ</button>
            </div>
            <input type="text" id="searchInput" oninput="searchNews()" placeholder="🔍 ค้นหาหัวข้อข่าว..." class="w-full md:w-64 px-4 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
        </div>

        <!-- News Grid -->
        <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-slate-500">กำลังโหลดข่าวสารล่าสุด...</div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-navy-dark text-slate-400 text-xs py-6 border-t border-slate-800 mt-auto">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p>© 2026 Railway News Hub. Modern Transportation Intelligence Platform.</p>
        </div>
    </footer>

    <script>
        let allNews = [];

        async function fetchNews() {
            try {
                const response = await fetch('./data/news.json');
                allNews = await response.json();
                renderNews(allNews);
            } catch (error) {
                document.getElementById('newsGrid').innerHTML = `
                    <div class="col-span-full bg-white p-8 rounded-xl border border-slate-200 text-center">
                        <p class="text-slate-600 font-semibold mb-2">ยังไม่พบข้อมูลข่าวสารในระบบ</p>
                        <p class="text-xs text-slate-400">กรุณากด Run Workflow ใน GitHub Actions เพื่อสร้างไฟล์ news.json รอบแรก</p>
                    </div>
                `;
            }
        }

        function renderNews(newsList) {
            const container = document.getElementById('newsGrid');
            if (newsList.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-8 text-slate-400">ไม่พบข้อมูลข่าวสาร</div>';
                return;
            }

            container.innerHTML = newsList.map(item => `
                <div class="bg-white rounded-xl border ${item.is_accident ? 'border-red-500 shadow-md ring-1 ring-red-400' : 'border-slate-200 shadow-sm'} flex flex-col overflow-hidden hover:shadow-md transition-shadow">
                    <div class="p-5 flex-grow flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-xs px-2.5 py-1 rounded-md font-medium ${item.country === 'Thailand' ? 'bg-orange-50 text-orange-primary border border-orange-200' : 'bg-blue-50 text-blue-600 border border-blue-200'}">
                                    ${item.source}
                                </span>
                                ${item.is_accident ? '<span class="text-xs px-2 py-0.5 bg-red-600 text-white font-bold rounded animate-pulse">🚨 อุบัติเหตุ</span>' : ''}
                            </div>
                            <h2 class="font-bold text-slate-900 text-base leading-snug mb-3 hover:text-orange-primary">
                                <a href="${item.link}" target="_blank">${item.title}</a>
                            </h2>
                        </div>
                        <div class="pt-4 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
                            <span>🕒 ${item.published_at}</span>
                            <a href="${item.link}" target="_blank" class="text-orange-primary font-semibold hover:underline flex items-center">
                                อ่านต่อ ↗
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterNews(country) {
            if (country === 'all') {
                renderNews(allNews);
            } else {
                renderNews(allNews.filter(n => n.country === country));
            }
        }

        function searchNews() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            renderNews(allNews.filter(n => n.title.toLowerCase().includes(query)));
        }

        fetchNews();
    </script>
</body>
</html>
