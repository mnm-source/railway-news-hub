name: Railway News Automation Cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache SQLite Database
        uses: actions/cache@v3
        with:
          path: database.db
          key: db-${{ github.run_id }}
          restore-keys: |
            db-

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Scraper & LINE Alert
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python backend/fetch_and_notify.py

      - name: Commit & Push JSON Data to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json database.db
          git commit -m "Auto-update railway news data" || exit 0
          git push
